<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Program — Personal Dashboard</title>
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <div class="hero-top">
        <nav class="nav" id="nav">
          <button class="nav-tab active" data-view="news">News</button>
          <button class="nav-tab" data-view="resources">Knowledge Base</button>
        </nav>
      </div>
    </div>
  </header>

  <main>
    <section class="section view" data-view="news">
      <div class="section-head">
        <h2>AI Briefing</h2>
        <span class="muted" id="news-count"></span>
      </div>
      <div class="news" id="news"></div>
    </section>

    <section class="section view hidden full-bleed" data-view="resources">
      <div class="resources-layout">
        <aside class="resources-sidebar">
          <div class="resources-sidebar-head">
            <h2>Knowledge Base</h2>
            <span class="muted" id="resources-count"></span>
          </div>
          <nav id="resources-tree" class="resources-tree"></nav>
        </aside>
        <main class="resources-main">
          <div id="resources-content" class="resources-content"></div>
        </main>
      </div>
    </section>
  </main>

  <footer class="foot">
    <span>Static dashboard · edit knowledge base in <code>resources/</code> (then run <code>python3 frontend/scripts/build-resources.py</code>) and news in <code>frontend/data/news.js</code></span>
  </footer>

  <script src="data/resources.js"></script>
  <script src="data/news.js"></script>
  <script src="assets/util.js"></script>
  <script src="assets/resources.js"></script>
  <script src="assets/briefing.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
