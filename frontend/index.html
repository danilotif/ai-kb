<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-config="pageTitle">Dashboard</title>
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <div class="hero-top">
        <nav class="nav" id="nav">
          <button class="nav-tab active" data-view="news" data-config="tabs.news.label">News</button>
          <button class="nav-tab" data-view="resources" data-config="tabs.resources.label">Knowledge Base</button>
        </nav>
      </div>
    </div>
  </header>

  <main>
    <section class="section view" data-view="news">
      <div class="news" id="news"></div>
    </section>

    <section class="section view hidden full-bleed" data-view="resources">
      <div class="resources-layout">
        <aside class="resources-sidebar">
          <div class="resources-sidebar-head">
            <h2 data-config="tabs.resources.heading">Knowledge Base</h2>
            <span class="muted" id="resources-count"></span>
          </div>
          <nav id="resources-tree" class="resources-tree"></nav>
        </aside>
        <main class="resources-main">
          <div id="resources-content" class="resources-content"></div>
        </main>
      </div>
    </section>
  </main>

  <footer class="foot">
    <span data-config-html="footerHtml"></span>
  </footer>

  <script src="data/config.js"></script>
  <script src="data/resources.js"></script>
  <script src="data/news.js"></script>
  <script src="assets/util.js"></script>
  <script src="assets/resources.js"></script>
  <script src="assets/briefing.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
